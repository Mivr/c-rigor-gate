# Symbol policy for the selftest product (T007). Gate-owned; deny list as policy/hello.toml.
[global]
deny = ["kill", "fork", "vfork", "execve", "execv", "execvp", "execl", "ptrace", "_exit", "_Exit",
        "exit", "quick_exit", "abort_handler_s", "signal", "sigaction", "raise", "dlopen", "dlsym",
        "syscall", "getppid", "setjmp", "longjmp", "_setjmp", "sigsetjmp", "siglongjmp", "atexit",
        "at_quick_exit", "system", "popen", "mprotect", "prctl", "unlink", "rename", "remove",
        "rand", "srand", "random", "time", "clock_gettime", "gettimeofday", "getenv",
        "fopen", "open", "openat", "creat", "socket", "connect", "dup2", "dup3", "pipe", "pipe2",
        # Same powers by another name (T004 additions to the contract's list).
        "environ", "__environ", "_environ", "secure_getenv", "putenv", "setenv", "unsetenv",
        "clearenv", "execle", "execlp", "execvpe", "fexecve", "posix_spawn", "posix_spawnp",
        "clone", "killpg", "pthread_kill", "tgkill", "tkill", "sigqueue", "_longjmp"]
# The ctest runtime forks, kills and exits by design; it is the gate's own code.
trusted = ["gate//ctest:ctest"]

[module."//core:core"]
level = "L3"
impl = ["core/core.c"]
allow = []
exports = ["core_add", "core_sign"]

# T090: the cost of core_add over n bytes must be linear; perf/quad.c (a gate-held driver) calls it n^2 times.
[module."//core:core".perf.add_pairs]
class = "O(n)"
sizes = [200, 800]
seed = 1

[module."//core:core".perf.add_pairs.srcs]
"quad.c" = '''
#include <stddef.h>
#include <stdint.h>

#include "core/core.h"
#include "ctest/perf.h"

/* Gate-held generator and driver for core_add. The driver declares nothing: the policy says this must be O(n), and
 * the loop below is O(n^2) (every pair of input bytes), so the perf gate must report perf-class-exceeded. */

size_t perf_gen(uint64_t seed, size_t n, char *out, size_t cap)
{
    uint64_t x = seed * 6364136223846793005ULL + 1442695040888963407ULL;
    size_t i;
    if (n > cap) {
        return 0;
    }
    for (i = 0; i < n; i++) {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        out[i] = (char)(x >> 56);
    }
    return n;
}

uint64_t perf_run(const char *in, size_t len)
{
    int64_t total = 0;
    size_t i;
    size_t j;
    for (i = 0; i < len; i++) {
        for (j = 0; j < len; j++) {
            total += core_add((unsigned char)in[i], (unsigned char)in[j]);
        }
    }
    return (uint64_t)total;
}
'''

[module."//core:core_test"]
allow = []
exports = ["main"]

[module."//util:util"]
level = "L2"
impl = ["util/util.c"]
allow = ["malloc"]
exports = ["util_make_ramp", "util_sum"]

[module."//util:core_test"]
allow = []
exports = ["main"]

[module."//util:util_test"]
allow = ["free"]
exports = ["main"]
