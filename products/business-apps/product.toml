name = "business-apps"

[layout]
# Every module directory of the monorepo (one entry per module directory on main; add apps/** when the first app module lands). Coverage (B14) makes a missing one a
# finding (ungraded-path), and an entry that matches nothing a finding (stale-include).
include = ["lib/base/bits/**",
           "lib/base/core/**",
           "lib/base/ports/**",
           "lib/ds/blob/**",
           "lib/ds/dset/**",
           "lib/ds/fmap/**",
           "lib/ds/pool/**",
           "lib/ds/ring/**",
           "lib/ds/sidx/**",
           "lib/fmt/fmt/**",
           "lib/fmt/httpchunk/**",
           "lib/fmt/httpdef/**",
           "lib/fmt/httphdr/**",
           "lib/fmt/httpredir/**",
           "lib/fmt/httpreq/**",
           "lib/fmt/httpresp/**",
           "lib/fmt/i18n/**",
           "lib/fmt/jdom/**",
           "lib/fmt/jpull/**",
           "lib/fmt/jutf8/**",
           "lib/fmt/jw/**",
           "lib/fmt/kv/**",
           "lib/fmt/lines/**",
           "lib/fmt/mbrtu/**",
           "lib/fmt/url/**",
           "lib/io/pfio/**",
           "lib/io/pfscript/**",
           "lib/io/portfakes/**",
           "lib/io/posix_clock/**",
           "lib/io/posix_lock/**",
           "lib/io/posix_rand/**",
           "lib/rt/dtab/**",
           "lib/rt/elog/**",
           "lib/rt/ev/**",
           "lib/rt/fsm/**",
           "lib/rt/mbox/**",
           "lib/rt/rxwire/**",
           "lib/rt/sel/**",
           "lib/rt/tlog/**",
           "lib/sim/simclock/**",
           "lib/sim/simfs/**",
           "lib/sim/simrng/**",
           "lib/sim/trace/**"]
# Non-code only (docs, plans, live fixtures): an exclude that covers a BUCK or C file is a finding.
exclude = []
