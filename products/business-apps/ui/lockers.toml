# ---- timers (ui-rules.md: Screen timers and Message catalogue); lifetime_ms 0 = no limit ---------------------------
# Re-derived by gate/tools/ui_contract_derive.py: kind, lifetime_ms and countdown_shown must agree with ui-rules.md.
[[timer]]
kind = "choose_size"
class = "screen"
lifetime_ms = 30000
countdown_shown = true
dismiss = ["cancel", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "opened"
class = "screen"
lifetime_ms = 8000
countdown_shown = true
dismiss = ["done", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "report"
class = "screen"
lifetime_ms = 300000
countdown_shown = true
dismiss = ["done", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "lockout"
class = "screen"
lifetime_ms = 60000
countdown_shown = true
dismiss = []
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "dialog"
class = "message"
lifetime_ms = 8000
countdown_shown = true
dismiss = ["dismiss", "countdown"]
provenance = "spec:ui-rules.md#message-catalogue"
[[timer]]
kind = "snackbar"
class = "message"
lifetime_ms = 4000
countdown_shown = true
dismiss = ["dismiss", "tap-outside", "countdown"]
provenance = "spec:ui-rules.md#message-catalogue"
[[timer]]
kind = "banner"
class = "message"
lifetime_ms = 0
countdown_shown = false
dismiss = ["dismiss"]
provenance = "spec:ui-rules.md#message-catalogue"

# ---- required elements per state class (ui-look.md 3.2, 4.1, 6.1; ui-rules.md) -------------------------------------
[[state_class]]
id = "splash"
required = ["screen_headline"]
provenance = "spec:ui-rules.md#allowed-full-screen-states"
[[state_class]]
id = "welcome"
required = ["screen_headline", "subtitle", "numpad", "language_switch"]
provenance = "spec:ui-look.md#6.1"
[[state_class]]
id = "choose_size"
required = ["screen_headline", "countdown", "language_switch", "size_buttons", "cancel"]
provenance = "spec:ui-look.md#3.2"
[[state_class]]
id = "opened"
required = ["hero_number", "body", "countdown", "language_switch", "done"]
provenance = "spec:ui-look.md#3.2"
[[state_class]]
id = "report"
required = ["report_title", "countdown", "done"]
provenance = "spec:ui-look.md#3.2"
[[state_class]]
id = "lockout"
required = ["screen_headline", "body", "countdown"]
provenance = "spec:ui-look.md#3.2"
[[state_class]]
id = "inspection"
required = ["staff_strong", "done"]
provenance = "spec:ui-look.md#4.2"
[[state_class]]
id = "startup_fault"
required = ["screen_headline", "body", "staff_detail"]
provenance = "spec:ui-rules.md#allowed-full-screen-states"
[[state_class]]
id = "dialog"
required = ["notice_body", "countdown", "dismiss"]
provenance = "spec:ui-rules.md#presentation"
[[state_class]]
id = "snackbar"
required = ["notice_body", "countdown", "dismiss"]
provenance = "spec:ui-rules.md#presentation"
[[state_class]]
id = "banner"
required = ["notice_body", "dismiss"]
provenance = "spec:ui-rules.md#presentation"

# ---- toggle groups ------------------------------------------------------------------------------------------------
[[toggle_group]]
id = "language"
members = ["lang_bg", "lang_en"]
exactly_one = true
shown_on = ["welcome", "choose_size", "opened"]
marks = ["bg", "style"]     # U06: the selected button has another fill (6.1) and another style token (4.2: 20 / 21)
provenance = "spec:ui-look.md#6.1"

