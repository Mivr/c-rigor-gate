# ---- importance levels: derived from the type scale rank of the oracle (P004 11 Q7 is not answered) --------------
[[importance]]
level = 1
roles = ["hero_number", "screen_headline"]
provenance = "oracle:type scale rank of ui-look.md 4.1 (48 dp and above)"
[[importance]]
level = 2
roles = ["report_title", "body", "subtitle", "large_countdown", "notice_title", "notice_body", "key_label"]
provenance = "oracle:type scale rank of ui-look.md 4.1 (32 to 40 dp)"
[[importance]]
level = 3
roles = ["staff_detail", "staff_strong", "caption", "muted_caption", "error_caption", "notice_caption",
         "small_button_label"]
provenance = "oracle:type scale rank of ui-look.md 4.1 (24 dp and below)"

# ---- timers (ui-rules.md: Screen timers and Message catalogue); lifetime_ms 0 = no limit ---------------------------
# Re-derived by gate/tools/ui_contract_derive.py: kind, lifetime_ms and countdown_shown must agree with ui-rules.md.
[[timer]]
kind = "choose_size"
class = "screen"
lifetime_ms = 30000
countdown_shown = true
dismiss = ["cancel", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "opened"
class = "screen"
lifetime_ms = 8000
countdown_shown = true
dismiss = ["done", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "report"
class = "screen"
lifetime_ms = 300000
countdown_shown = true
dismiss = ["done", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "lockout"
class = "screen"
lifetime_ms = 60000
countdown_shown = true
dismiss = []
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "dialog"
class = "message"
lifetime_ms = 8000
countdown_shown = true
dismiss = ["dismiss", "countdown"]
provenance = "spec:ui-rules.md#message-catalogue"
[[timer]]
kind = "snackbar"
class = "message"
lifetime_ms = 4000
countdown_shown = true
dismiss = ["dismiss", "tap-outside", "countdown"]
provenance = "spec:ui-rules.md#message-catalogue"
[[timer]]
kind = "banner"
class = "message"
lifetime_ms = 0
countdown_shown = false
dismiss = ["dismiss"]
provenance = "spec:ui-rules.md#message-catalogue"

# ---- required elements per state class (ui-look.md 3.2, 4.1, 6.1; ui-rules.md) -------------------------------------
[[state_class]]
id = "splash"
required = ["headline"]
provenance = "spec:ui-rules.md#allowed-full-screen-states"
[[state_class]]
id = "welcome"
required = ["headline", "subtitle", "numpad", "language_switch"]
provenance = "spec:ui-look.md#6.1"
[[state_class]]
id = "choose_size"
required = ["headline", "countdown", "language_switch", "size_buttons", "cancel"]
provenance = "spec:ui-look.md#3.2"
[[state_class]]
id = "opened"
required = ["hero_number", "body", "countdown", "language_switch", "done"]
provenance = "spec:ui-look.md#3.2"
[[state_class]]
id = "report"
required = ["report_title", "countdown", "done"]
provenance = "spec:ui-look.md#3.2"
[[state_class]]
id = "lockout"
required = ["headline", "body", "countdown"]
provenance = "spec:ui-look.md#3.2"
[[state_class]]
id = "startup_fault"
required = ["headline", "body", "staff_detail"]
provenance = "spec:ui-rules.md#allowed-full-screen-states"
[[state_class]]
id = "dialog"
required = ["body", "countdown", "dismiss"]
provenance = "spec:ui-rules.md#presentation"
[[state_class]]
id = "snackbar"
required = ["body", "countdown", "dismiss"]
provenance = "spec:ui-rules.md#presentation"
[[state_class]]
id = "banner"
required = ["body", "dismiss"]
provenance = "spec:ui-rules.md#presentation"

# ---- toggle groups ------------------------------------------------------------------------------------------------
[[toggle_group]]
id = "language"
members = ["lang_bg", "lang_en"]
exactly_one = true
shown_on = ["welcome", "choose_size", "opened"]
provenance = "spec:ui-look.md#6.1"

# ---- input policy per layer (ui-rules.md: Presentation and the Rust-derived clarification) -------------------------
[[input_layer]]
layer = "screen"
blocks_input_below = false
tap_outside_dismisses = false
accepts_input = true
provenance = "spec:ui-rules.md#presentation"
[[input_layer]]
layer = "splash"
blocks_input_below = false
tap_outside_dismisses = false
accepts_input = false
provenance = "spec:ui-rules.md#allowed-full-screen-states"
[[input_layer]]
layer = "lockout"
blocks_input_below = false
tap_outside_dismisses = false
accepts_input = false
provenance = "spec:ui-rules.md#presentation"
[[input_layer]]
layer = "dialog"
blocks_input_below = true
tap_outside_dismisses = false
accepts_input = true
provenance = "spec:ui-rules.md#presentation"
[[input_layer]]
layer = "snackbar"
blocks_input_below = false
tap_outside_dismisses = true
accepts_input = true
provenance = "spec:ui-rules.md#presentation"
[[input_layer]]
layer = "banner_notice"
blocks_input_below = false
tap_outside_dismisses = true
accepts_input = true
provenance = "spec:ui-rules.md#presentation"
[[input_layer]]
layer = "banner_persistent"
blocks_input_below = false
tap_outside_dismisses = false
accepts_input = true
provenance = "spec:ui-rules.md#rust-derived-clarification"

# ---- wrap, ellipsis and clip (ui-look.md 5): no line cap and no elision anywhere ------------------------------------
[[wrap]]
scope = "default"
wrap = "word"
max_lines = 0
ellipsis = false
clip = false
provenance = "spec:ui-look.md#5"
[[wrap]]
scope = "code_echo"
wrap = "char"
max_lines = 0
ellipsis = false
clip = false
provenance = "spec:ui-look.md#5"
[[wrap]]
scope = "size_button_label"
wrap = "char"
max_lines = 0
ellipsis = false
clip = false
provenance = "spec:ui-look.md#5"
[[wrap]]
scope = "single_line"
wrap = "none"
max_lines = 1
ellipsis = false
clip = false
provenance = "spec:ui-look.md#5"

