# The UI contract of the lockers kiosk (docs/ui-contract.md). OWNER-SEALED: changing this file needs the owner's
# signature (P004 section 8.5). Every entry carries a provenance; `pending = "<n>"` is P004 section 11 question n,
# not yet answered by the owner: a judge that needs it gets `contract-pending`, never a default.
schema = "ui-contract/1"
product = "business-apps/lockers"

# ---- window and panel -------------------------------------------------------------------------------------------
[window]
width_px  = { value = 1280, provenance = "spec:ui-look.md#1" }
height_px = { value = 800, provenance = "spec:ui-look.md#1" }
unit_px   = { value = 8, provenance = "spec:ui-look.md#1" }
pad_px    = { value = 24, provenance = "spec:ui-look.md#1" }
gap_px    = { value = 16, provenance = "spec:ui-look.md#1" }

[panel]
diagonal_in         = { pending = "9", provenance = "spec:P004#11-q9" }
viewing_distance_mm = { pending = "9", provenance = "spec:P004#11-q9" }

# KioskMetrics type scale (ui-look.md 1): px = dp at 1280x800.
[type_scale]
display  = { value = 200, provenance = "spec:ui-look.md#1" }
headline = { value = 48, provenance = "spec:ui-look.md#1" }
title    = { value = 40, provenance = "spec:ui-look.md#1" }
body     = { value = 32, provenance = "spec:ui-look.md#1" }
staff    = { value = 24, provenance = "spec:ui-look.md#1" }
caption  = { value = 16, provenance = "spec:ui-look.md#1" }

[reading]
rate_wpm = { pending = "11", provenance = "spec:P004#11-q11" }

[clock]
tick_ms = { value = 250, provenance = "spec:P004#3.5" }   # runtime.h C2, quoted by P004 3.5

[policy]
error_dialog      = { pending = "11", provenance = "spec:P004#11-q11" }   # ui-rules.md says fixed 8 s; owner undecided
target_population = { pending = "10", provenance = "spec:P004#11-q10" }

# A whole table the owner has not decided: the rows are absent and a judge asking for them gets contract-pending.
[pending_tables]
importance = { pending = "7", provenance = "spec:P004#11-q7" }

# ---- thresholds (P004 3.10); literature:3.10/<key>, or design:P004#3.10-<key> where P004 marks the value [I] or [P] -------------------------------------
[thresholds]
keypad_key_min_mm             = { pending = "10", provenance = "literature:3.10/keypad_key_min_mm" }
button_recommended_mm         = { pending = "10", provenance = "literature:3.10/button_recommended_mm" }
button_floor_mm               = { pending = "10", provenance = "literature:3.10/button_floor_mm" }
touch_min_mm                  = { value = 14, provenance = "literature:3.10/touch_min_mm" }
touch_min_dp                  = { value = 48, provenance = "literature:3.10/touch_min_dp" }
hit_overlap_allowed           = { value = false, provenance = "literature:3.10/hit_overlap_allowed" }
spacing_hard_mm               = { value = 1, provenance = "literature:3.10/spacing_hard_mm" }
spacing_recommended_mm        = { value = 3, provenance = "literature:3.10/spacing_recommended_mm" }
probe_grid_pct                = { value = [20, 50, 80], provenance = "design:P004#3.10-probe_grid_pct" }
probe_disc_radius_mm          = { value = 7.5, provenance = "literature:3.10/probe_disc_radius_mm" }
feedback_rendered_frames_max  = { value = 5, provenance = "literature:3.10/feedback_rendered_frames_max" }
feedback_target_frames        = { value = 2, provenance = "design:P004#3.10-feedback_target_frames" }
frame_hz                      = { value = 60, provenance = "design:P004#3.10-frame_hz" }
busy_indicator_ms             = { value = 1000, provenance = "literature:3.10/busy_indicator_ms" }
busy_progress_cancel_ms       = { value = 10000, provenance = "literature:3.10/busy_progress_cancel_ms" }
dwell_base_ms                 = { value = 1000, provenance = "design:P004#3.10-dwell_base_ms" }
dwell_floor_ms                = { value = 3500, provenance = "design:P004#3.10-dwell_floor_ms" }
dwell_chars_per_word          = { value = 5.6, provenance = "design:P004#3.10-dwell_chars_per_word" }
flicker_floor_ms              = { pending = "5", provenance = "design:P004#3.10-flicker_floor_ms" }
legibility_xheight_deg        = { value = 0.2, provenance = "literature:3.10/legibility_xheight_deg" }
contrast_text                 = { pending = "15", provenance = "literature:3.10/contrast_text" }
contrast_large                = { pending = "15", provenance = "literature:3.10/contrast_large" }
pseudo_expansion_overall_pct  = { value = 40, provenance = "literature:3.10/pseudo_expansion_overall_pct" }
relational_geometry_tol_px    = { value = 1, provenance = "design:P004#3.10-relational_geometry_tol_px" }
pixel_tolerance               = { value = 0, provenance = "literature:3.10/pixel_tolerance" }
hierarchy_ratio_k             = { pending = "5", provenance = "design:P004#3.10-hierarchy_ratio_k" }

