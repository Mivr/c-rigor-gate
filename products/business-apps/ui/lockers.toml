# The input policy of each layer role (ui-rules.md, Presentation; a scrim's by the card it belongs to). A dialog blocks
# the input behind it; a tap outside a snackbar dismisses it. A banner's scrim and card cannot be told apart by role:
# a notice of kind banner has a dismissing full-window scrim, a banner of the persistent set has no tap-outside area
# (ui-rules.md, "Rust-derived clarification"): the owner decides (P004 11 q7).
[[layer]]
id = "dialog"
role = "dialog"
policy = "capture-modal-inert"
provenance = "spec:ui-rules.md#presentation"
[[layer]]
id = "dialog-scrim"
role = "scrim"
card = "dialog"
policy = "capture-modal-inert"
provenance = "spec:ui-rules.md#presentation"
[[layer]]
id = "snackbar"
role = "snackbar"
policy = "capture-and-dismiss"
provenance = "spec:ui-rules.md#presentation"
[[layer]]
id = "snackbar-scrim"
role = "scrim"
card = "snackbar"
policy = "capture-and-dismiss"
provenance = "spec:ui-rules.md#presentation"
[[layer]]
id = "banner"
role = "banner"
pending = "7"
provenance = "spec:P004#11-q7"
[[layer]]
