# ---- timers (ui-rules.md: Screen timers and Message catalogue); lifetime_ms 0 = no limit ---------------------------
# Re-derived by gate/tools/ui_contract_derive.py: kind, lifetime_ms and countdown_shown must agree with ui-rules.md.
[[timer]]
kind = "choose_size"
class = "screen"
lifetime_ms = 30000
countdown_shown = true
dismiss = ["cancel", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "opened"
class = "screen"
lifetime_ms = 8000
countdown_shown = true
dismiss = ["done", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "report"
class = "screen"
lifetime_ms = 300000
countdown_shown = true
dismiss = ["done", "countdown"]
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "lockout"
class = "screen"
lifetime_ms = 60000
countdown_shown = true
dismiss = []
provenance = "spec:ui-rules.md#screen-timers"
[[timer]]
kind = "dialog"
class = "message"
lifetime_ms = 8000
countdown_shown = true
dismiss = ["dismiss", "countdown"]
provenance = "spec:ui-rules.md#message-catalogue"
[[timer]]
kind = "snackbar"
class = "message"
lifetime_ms = 4000
countdown_shown = true
dismiss = ["dismiss", "tap-outside", "countdown"]
provenance = "spec:ui-rules.md#message-catalogue"
[[timer]]
kind = "banner"
class = "message"
lifetime_ms = 0
countdown_shown = false
dismiss = ["dismiss"]
provenance = "spec:ui-rules.md#message-catalogue"

# ---- required elements per state class (ui-look.md 3.2, 4.1, 6.1; ui-rules.md) -------------------------------------
