# rejection dialog 320..326), screens:L1870 (the snackbar 320..326), screens:L2545 (banners 264.., 272.., 288..),
# screens:L2903 (the report, Done 16), probe:U23 (codes offline 280..284; not saved 256..260).
[u1]
events = [
  # the pad digits (screens:L147-L158; rules:L26 the code pad)
  { id = "digit-0", intent = 42, arg = 0, expect = "accept" },
  { id = "digit-1", intent = 32, arg = 0, expect = "accept" },
