# ---- U4: code macros by boundary class, through the wedge and the pad -------------------------------------------
# rules:L52 "not valid: empty, not all digits, longer than 64, or 1 to 5 digits"; "not recognised"; fixtures model:L55.
# The pad: the catalogue's pad macro sends `apply 3 <digit_intent> <digit>`, but this adapter takes an intent as the
# scene node key with arg 0 (model:L76): a digit d != 0 is refused. Only codes of zeros can be typed through the pad,
# with digit_intent = 42 (the key "0") and enter_intent = 43 ("OK"). That limit is reported in the first-run doc.
[u4]
events = [
  { id = "wedge-empty", boundary = "empty", via = "wedge", hex = "", expect = "accept" },
  { id = "wedge-one-digit", boundary = "one-digit", via = "wedge", hex = "31", expect = "accept" },
