# The deviation baseline of the business-apps UI (docs/ui-deviations.md). A CONTRACT FILE: a new accepted id, a changed tag
# or a higher cap is a loosening only a task whose contract names it may make (docs/trust.md; nothing is signed). The ratchet only goes
# down: delete an id when its tag is gone (`deviation-removed` says so).
#
# Each accepted id carries its `until` and the sha256 of the canonical form of the tag (canonical JSON, sorted keys,
# compact, ASCII, trailing newline, of {id, oracle, state (list), reason, link, until, path}; the path is the header it stands in); a tag whose fields differ
# is `deviation-changed`.
schema = "ui-deviations/3"
product = "business-apps"
cap = 0
# A `reference-bug` tag must link an issue of the oracle's repository: the link is this literal prefix followed by an
# issue number of 1 to 7 digits, nothing else (a fixed grammar, no regular expression).
reference_bug_link_prefix = "https://github.com/Mivr/club-apps/issues/"

[accepted]
