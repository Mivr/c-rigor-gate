# Lockers layers (T104), bottom to top, one directory family each (design.md section 4.1): lk = domain, relay = safety
# core, lkrx = folds, reactors and view, lkadp = adapters, lksim = their simulation, lkui = scene builders and
# catalogs, lkapp = composition root and shells. A dependency on a higher layer is an upward-edge whatever the edges say.
[layer."app-domain"]
modules = ["//apps/lockers/lk/**"]

# The contracts (interface modules; gate decoupling): no module yet. The first one adds its package here.
[layer."app-contract"]
modules = ["//apps/lockers/lkc/**"]

[layer."app-safety"]
modules = ["//apps/lockers/relay/**"]

[layer."app-reactors"]
modules = ["//apps/lockers/lkrx/**"]

[layer."app-adapters"]
modules = ["//apps/lockers/lkadp/**"]

[layer."app-sim"]
modules = ["//apps/lockers/lksim/**"]

[layer."app-ui"]
modules = ["//apps/lockers/lkui/**"]

[layer."app-root"]
modules = ["//apps/lockers/lkapp/**"]

# Fiscal collector layers (G0 of docs/fiscal/mvp/tasks.md; docs/fiscal/mvp/collector.md sections 1 and 2.5,
# simulator.md section 1), bottom to top. They are EMPTY until their first module lands, because a pattern that matches
# no module is `contract-stale`: each item adds its module's pattern to its layer, and its edges, in the same pin
# (the per-item snippets are in the G0 report). Layer assignment:
#   fiscal-contract: apps/fiscal/dtc/{types,ports}
#   fiscal-domain:   apps/fiscal/dt/*, apps/fiscal/journal/*
#   fiscal-safety:   apps/fiscal/dtsafe/{req,guard}
#   fiscal-adapters: apps/fiscal/dtadp/*
#   fiscal-sim:      apps/fiscal/dtsim/*
#   fiscal-root:     apps/fiscal/dtrun/loop, apps/fiscal/dtapp/*   (apps/fiscal/itest/* are c_test only, outside the layers)
# Safety wiring rules, enforced by the edges (an edge that is not declared is `undeclared-edge`):
#   * no layer-to-layer edge points into fiscal-safety, and none between its two modules: only
#     dtrun/loop -> dtsafe/req and dtadp/devhttp -> dtsafe/guard exist, as module edges (added with their items);
#   * fiscal-domain, fiscal-adapters and fiscal-sim have no edge to lib//httpreq here: the only edges to httpreq are
#     dtsafe/req (port edge, symbol http_request_write_with only) and dtadp/pushhttp (the only module that may use
#     http_request_write_req), both module edges added with their items;
#   * fiscal-domain has no edge to fiscal-adapters or fiscal-safety; fiscal-sim has none to fiscal-domain or
#     fiscal-safety (the simulator shares no code with the collector).
[layer."fiscal-contract"]
modules = ["//apps/fiscal/dtc/ports:ports", "//apps/fiscal/dtc/types:types"]

# apps/fiscal/journal/* is fiscal-domain (collector.md section 1: journal parsers are domain leaves); the first module is
# journal/receipt (P009 T1.1). Its two libraries (:rcpt, :rcline) and the :rcpt_fuzz target are inside the layer, so their
# edges to each other are the fiscal-domain -> fiscal-domain edge below; the edges to lib-fmt are module edges (see the
# fiscal block further down).
[layer."fiscal-domain"]
modules = ["//apps/fiscal/journal/**", "//apps/fiscal/night/**"]

[layer."fiscal-safety"]
modules = []

[layer."fiscal-adapters"]
modules = []

[layer."fiscal-sim"]
modules = []

[layer."fiscal-root"]
modules = []

# The reservations app (app resv, business-control P008/S1): domain layer. apps/resv/dom/tables is freestanding (no deps at
# all), so no edge leaves the layer; a module that later needs lib-base declares its own edge.
[layer."resv-dom"]
modules = ["//apps/resv/dom/**"]

# The reservations app's text layer (P008 S4): apps/resv/fmt/out prints the read operations. Above resv-dom (it uses the
# tables inventory and the parsed arguments of apps/resv/dom/args), down to lib-base (core, and //lib/fmt/fmt which sits in
# lib-base) and, as a module edge, to lib-fmt tzeu (UTC -> Europe/Sofia). The c_test targets are exempt.
[layer."resv-fmt"]
modules = ["//apps/resv/fmt/**"]

# The reservations app's decision layer (P008 S5a): apps/resv/ops/rules (nine packages split for the mutant budget: time,
# space, fold, name, repr, text, pick, update, decide, plus the header-only top `rules`). Above resv-fmt (rout's row
# types and folding) and resv-dom (args, tables), down to lib-base (core, fmt) and, as a module edge, to lib-fmt tzeu
# (time). Pure: every decision is a function of typed rows.
[layer."resv-ops"]
modules = ["//apps/resv/ops/**"]

# The staff bot (app staffbot, business-control P008): its core is C compiled natively for the tests and to wasm32 for the
# Worker. A layer of its own, above the others and with no edge to any of them: the core ABI module uses nothing but the
# compiler's builtin headers and <string.h>. The c_wasm target (staffbot_wasm) is an artifact with no facts, so it is in
# no layer and no policy table.
[layer."staffbot-core"]
modules = ["//apps/staffbot/core/**"]

# The Viva card-payments app (app viva, business-control P009 T4.1): the per-night transaction walk. One layer, `tx`, for
# the four packages of apps/viva/tx (the walk and its three splits when/count/text, split for the mutant budget). Edges:
# inside the layer, down to lib-base (core, and //lib/fmt/fmt which sits in lib-base) and, as module edges, to the three
# lib-fmt modules it uses (jpull, money, tzeu); no edge to any other app. The c_test targets are exempt; the c_fuzz target
# is covered by the layer edges (it calls :vtx and core).
[layer."viva-tx"]
modules = ["//apps/viva/tx/**"]

# The club books app (app books, business-control P009 T2.1): the cash ledger, posting rules of club-fiscal's cash_ledger.csv.
# One layer for the two packages of apps/books/ledger (the ledger and its row codec row/, split for the mutant budget).
# Edges: inside the layer, down to lib-base (core) and, as module edges, to the lib-fmt modules it uses (csv, money, tzeu).
[layer."books-ledger"]
modules = ["//apps/books/ledger/**"]

# The club books ops (P009 T2.2): apps/books/ops — types (header-only, over the ledger's types) and args (the argv rules
# of club-fiscal's books commands, split into text, ap, canon, field, item, cmds and the top bkargs for the mutant budget).
# Above books-ledger, down to lib-base and, as module edges, to the lib-fmt modules they call.
[layer."books-ops"]
modules = ["//apps/books/ops/**"]

# The staff bot's ops (P009 T4.2a): apps/staffbot/ops/viva runs the Viva walk (apps/viva/tx) for the bot. Above viva-tx (the
# first edge from one app to another: the staff bot uses the viva app's walk), down to lib-base (core) and, as a module
# edge, to lib-fmt tzeu (now -> night). Pure: the caller owns the one vop_t.
[layer."staffbot-ops"]
modules = ["//apps/staffbot/ops/**"]

# The composition root of staffbot.wasm (P009 T4.2a): apps/staffbot/wasm owns the module's only mutable static data (one
# vop_t and a text buffer) and the op table behind sb_call2. Pure edges (as app-root: this product declares no
# [composition] modules) to the core ABI, the ops and lib-base (core_buf_*). The c_wasm
# target staffbot_wasm is an artifact with no facts (in no layer and no policy table), as before.
[layer."staffbot-root"]
modules = ["//apps/staffbot/wasm/**"]

