# Architecture contract for business-apps (T092; gate layering, docs/layering.md). Gate-owned.
# Layers follow business-apps docs/design.md section 2/3: seven library layers, then the lockers app layers.
# Layers with no module yet are empty; they are listed so the order is fixed before the first module lands.
[layers]
order = ["lib-base", "lib-ds", "lib-rt", "lib-fmt", "lib-io", "lib-ui", "lib-sim",
         "app-domain", "app-contract", "app-safety", "app-reactors", "app-adapters", "app-sim", "app-ui", "app-root"]

[layer."lib-base"]
# design.md section 3 puts the number/text formatting kit `fmt` in the base tier although it lives under lib/fmt/ (it is
# below lib-rt: tlog uses it). Module labels cannot be excluded from a glob, so lib-fmt lists its packages.
modules = ["//lib/base/**", "//lib/fmt/fmt:*"]

[layer."lib-ds"]
modules = ["//lib/ds/**"]

[layer."lib-rt"]
modules = ["//lib/rt/**"]

[layer."lib-fmt"]
modules = ["//lib/fmt/fp:*", "//lib/fmt/httpchunk:*", "//lib/fmt/httpdef:*", "//lib/fmt/httphdr:*", "//lib/fmt/httpredir:*", "//lib/fmt/httpreq:*",
           "//lib/fmt/httpresp:*", "//lib/fmt/i18n:*", "//lib/fmt/jdom:*", "//lib/fmt/jkidx:*", "//lib/fmt/jlex:*", "//lib/fmt/jnum:*", "//lib/fmt/jpnum:*", "//lib/fmt/jpull:*",
           "//lib/fmt/jstr:*", "//lib/fmt/jtok:*", "//lib/fmt/jutf8:*", "//lib/fmt/jw:*", "//lib/fmt/kv:*", "//lib/fmt/lines:*",
           "//lib/fmt/mbrtu:*", "//lib/fmt/pct:*", "//lib/fmt/url:*"]

# Non-test libraries only tests may use (test kits over a module's fake or real seam).
[testkit]
modules = ["//lib/io/posix_fs:testkit",
           "//lib/io/posix_listen:testkit",
           "//lib/io/posix_net:testkit",
           "//lib/io/tls_stream:testkit",
           "//lib/sim/simnet:testkit",
           "//lib/ui/scenediff:testkit",
           "//lib/ui/lvrender:testkit",
           "//lib/ui/lvhost:testkit",
           "//lib/ui/uikit:testkit",
           "//apps/lockers/lk/auditplan:testkit",
           "//apps/lockers/lk/book:testkit",
           "//apps/lockers/lk/booktext:testkit",
           "//apps/lockers/lk/codesfile:testkit",
           "//apps/lockers/lk/inventory:testkit",
           "//apps/lockers/lk/preflight:testkit",
           "//apps/lockers/lk/report:testkit",
           "//apps/lockers/lk/selftest:testkit",
           "//apps/lockers/lk/syncbody:testkit",
           "//apps/lockers/lkadp/auditfile:testkit",
           "//apps/lockers/lkadp/bookfile:testkit",
           "//apps/lockers/lkadp/codeshttp:testkit",
           "//apps/lockers/lkadp/e2eclock:testkit",
           "//apps/lockers/lkadp/inventoryfile:testkit",
           "//apps/lockers/lkadp/relaytcp:testkit",
           "//apps/lockers/lkadp/synchttp:testkit",
           "//apps/lockers/lkapp/commission:boardkit",
           "//apps/lockers/lkapp/commission:testkit",
           "//apps/lockers/lkapp/checkconfig:testkit",
           "//apps/lockers/lkapp/e2e:testkit",
           "//apps/lockers/lkapp/posixio:testkit",
           "//apps/lockers/lkapp/runtime:testkit",
           "//apps/lockers/lkapp/winpolicy:testkit",
           "//apps/lockers/lkapp/wire:testkit",
           "//apps/lockers/lkrx/boot:testkit",
           "//apps/lockers/lkrx/catalog:testkit",
           "//apps/lockers/lkrx/codes:testkit",
           "//apps/lockers/lkrx/fold_core:testkit",
           "//apps/lockers/lkrx/fold_status:testkit",
           "//apps/lockers/lkrx/notice:testkit",
           "//apps/lockers/lkrx/notice:unitkit",
           "//apps/lockers/lkrx/pad:testkit",
           "//apps/lockers/lkrx/shift:testkit",
           "//apps/lockers/lkrx/sync:testkit",
           "//apps/lockers/lkrx/view:testkit",
           "//apps/lockers/lkrx/visit:testkit",
           "//apps/lockers/lkrx/vstate:testkit",
           "//apps/lockers/lksim/board:testkit",
           "//apps/lockers/lkui/notices:testkit",
           "//apps/lockers/lkui/input:testkit",
           "//apps/lockers/lkui/screens:testkit",
           "//apps/lockers/relay/driver:testkit",
           "//apps/lockers/relay/opener_sm:testkit"]

[layer."lib-io"]
modules = ["//lib/io/**"]

[layer."lib-ui"]
modules = ["//lib/ui/**"]

[layer."lib-sim"]
modules = ["//lib/sim/**"]

# Lockers layers (T104), bottom to top, one directory family each (design.md section 4.1): lk = domain, relay = safety
# core, lkrx = folds, reactors and view, lkadp = adapters, lksim = their simulation, lkui = scene builders and
# catalogs, lkapp = composition root and shells. A dependency on a higher layer is an upward-edge whatever the edges say.
[layer."app-domain"]
modules = ["//apps/lockers/lk/**"]

# The contracts (interface modules; gate decoupling): no module yet. The first one adds its package here.
[layer."app-contract"]
modules = ["//apps/lockers/lkc/**"]

[layer."app-safety"]
modules = ["//apps/lockers/relay/**"]

[layer."app-reactors"]
modules = ["//apps/lockers/lkrx/**"]

[layer."app-adapters"]
modules = ["//apps/lockers/lkadp/**"]

[layer."app-sim"]
modules = ["//apps/lockers/lksim/**"]

[layer."app-ui"]
modules = ["//apps/lockers/lkui/**"]

[layer."app-root"]
modules = ["//apps/lockers/lkapp/**"]

