# Lockers domain (apps/lockers/lk/**) rules, not one-off edges. A domain module may use the base, data-structure and
# format libraries and lk/types, the shared types of the layer. Nothing else is declared, so a domain module that
# reaches lib-rt, lib-io, lib-ui or lib-sim (or another lk module before the design's dependency column is added
# here) is an undeclared-edge. lib/** can never depend on apps/**: app-domain is above every lib layer in `order`
# (an upward-edge, declared or not).
[[edge]]
from = "app-domain"
to = "lib-base"
kind = "pure"

[[edge]]
from = "app-domain"
to = "lib-ds"
kind = "pure"

[[edge]]
from = "app-domain"
to = "lib-fmt"
kind = "pure"

[[edge]]
from = "app-domain"
to = "//apps/lockers/lk/types:types"
kind = "pure"

# jlex (the JSON lexer) is split out of jpull and uses jpnum, the number scanner split out of it (same tier).
[[edge]]
from = "//lib/fmt/jpull:jpull"
to = "//lib/fmt/jlex:jlex"
kind = "pure"

[[edge]]
from = "//lib/fmt/jlex:jlex"
to = "//lib/fmt/jpnum:jpnum"
kind = "pure"

[[edge]]
from = "//lib/fmt/jlex:jlex"
to = "//lib/fmt/jutf8:jutf8"
kind = "pure"

[[edge]]
from = "//lib/fmt/jpull:jpull"
to = "//lib/fmt/jpnum:jpnum"
kind = "pure"

[[edge]]
from = "//lib/fmt/jlex:jlex"
to = "lib-base"
kind = "pure"

[[edge]]
from = "//lib/fmt/jpnum:jpnum"
to = "lib-base"
kind = "pure"

# Lockers layer rules (T104), by the dependency column of design.md section 4.1. Rules between layers, so a new module in
# a layer is judged without a new edge; only a library the design names for one module is an edge of that module.
# Direction: lk (domain) < relay (safety core) < lkrx (reactors) < lkadp (adapters) < lksim < lkui < lkapp (root), above
# every lib layer in `order`, so lib/** can never depend on apps/** (an upward-edge, declared or not).
# Inside a layer every module may use every other: the graph is acyclic by Buck2, and the column is checked per
# module against the BUCK deps by review, not by this file.
[[edge]]
from = "app-domain"
to = "app-domain"
kind = "pure"

# lk/outcome is a dtab table (the one domain module that reaches lib-rt).
[[edge]]
from = "//apps/lockers/lk/outcome:outcome"
to = "//lib/rt/dtab:dtab"
kind = "pure"

