[module."//apps/resv/ops/rules/update:rrul_update_test"]
allow = ["memcpy", "memset", "strlen"]
exports = ["main"]

[module."//apps/resv/ops/rules/name:rrul_name_fuzz"]
allow = ["memset", "strlen"]
allow_builtins = ["__builtin_trap"]
exports = ["LLVMFuzzerTestOneInput"]

[module."//apps/resv/ops/rules/time:rrul_ts_fuzz"]
allow = []
