# T096: sidx seal is O(n log n) and find O(log n); n appends, one seal and 1.5n finds are O(n log n) in total.
[module."//lib/ds/sidx:sidx".perf.seal_find]
class = "O(n log n)"
sizes = [2000, 8000]
seed = 13

[module."//lib/ds/sidx:sidx".perf.seal_find.srcs]
"seal_find.c" = '''
#include <stddef.h>
#include <stdint.h>

#include "ctest/perf.h"
#include "lib/ds/sidx/sidx.h"

/* Gate-held generator and driver for sidx. Input: 2n 8-byte keys, the first n present (in pseudo-random order), the
 * last n absent; all distinct (bijective mixer of the index and the policy seed). */

#define MAXN 8000u
#define KW 8u
#define VW 4u

static unsigned char g_rec[MAXN * (KW + VW)];

static uint64_t mix(uint64_t x)
{
    x += 0x9E3779B97F4A7C15ULL;
    x = (x ^ (x >> 30)) * 0xBF58476D1CE4E5B9ULL;
    x = (x ^ (x >> 27)) * 0x94D049BB133111EBULL;
    return x ^ (x >> 31);
}

size_t perf_gen(uint64_t seed, size_t n, char *out, size_t cap)
{
    size_t i;
    size_t b;
    if (n > MAXN || 2 * n * KW > cap) {
        return 0;
    }
    for (i = 0; i < 2 * n; i++) {
        uint64_t k = mix(seed * 0x100000001B3ULL + (uint64_t)i);
        for (b = 0; b < KW; b++) {
            out[i * KW + b] = (char)(k >> (8 * (KW - 1 - b)));
        }
    }
    return 2 * n * KW;
}

uint64_t perf_run(const char *in, size_t len)
{
    sidx_t s;
    size_t n = len / (2 * KW);
    uint64_t acc = 0;
    size_t i;
    const unsigned char *k = (const unsigned char *)in;
    unsigned char v[VW] = {1, 2, 3, 4};
    if (n == 0 || n > MAXN || len != 2 * n * KW) {
        return PERF_ERR;
    }
    if (!sidx_init(&s, g_rec, (uint32_t)n, KW, VW)) {
        return PERF_ERR;
    }
    for (i = 0; i < n; i++) {
        if (sidx_append(&s, k + i * KW, v) != SIDX_OK) {
            return PERF_ERR;
        }
    }
    if (sidx_seal(&s) != SIDX_OK) {
        return PERF_ERR;
    }
    for (i = 0; i < n; i++) {
        acc += sidx_find(&s, k + i * KW) != NULL ? 1u : 0u;
    }
    for (i = n; i < n + n / 2; i++) {
        acc += sidx_find(&s, k + i * KW) != NULL ? 1000003u : 0u;
    }
    return acc;
}
'''

