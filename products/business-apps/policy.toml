# T096: fmap is O(1) expected per op, so n puts, 1.5n gets and n/2 deletes plus n gets are O(n) in total.
[module."//lib/ds/fmap:fmap".perf.ops]
class = "O(n)"
sizes = [2000, 8000]
seed = 11

[module."//lib/ds/fmap:fmap".perf.ops.srcs]
"ops.c" = '''
#include <stddef.h>
#include <stdint.h>

#include "ctest/perf.h"
#include "lib/ds/fmap/fmap.h"

/* Gate-held generator and driver for fmap. Input: 2n 8-byte keys, the first n present, the last n absent; all
 * distinct (the index is passed through a bijective 64-bit mixer, so the keys carry the policy seed only). */

#define MAXN 8000u
#define SLOTS 16384u
#define KW 8u

static uint16_t g_tags[SLOTS];
static unsigned char g_keys[SLOTS * KW];
static unsigned char g_vals[SLOTS * KW];

static uint64_t mix(uint64_t x)
{
    x += 0x9E3779B97F4A7C15ULL;
    x = (x ^ (x >> 30)) * 0xBF58476D1CE4E5B9ULL;
    x = (x ^ (x >> 27)) * 0x94D049BB133111EBULL;
    return x ^ (x >> 31);
}

size_t perf_gen(uint64_t seed, size_t n, char *out, size_t cap)
{
    size_t i;
    size_t b;
    if (n > MAXN || 2 * n * KW > cap) {
        return 0;
    }
    for (i = 0; i < 2 * n; i++) {
        uint64_t k = mix(seed * 0x100000001B3ULL + (uint64_t)i);
        for (b = 0; b < KW; b++) {
            out[i * KW + b] = (char)(k >> (8 * b));
        }
    }
    return 2 * n * KW;
}

uint64_t perf_run(const char *in, size_t len)
{
    fmap_t m;
    fmap_store_t st;
    size_t n = len / (2 * KW);
    uint32_t slots = 4096;
    uint64_t acc = 0;
    size_t i;
    const unsigned char *k = (const unsigned char *)in;
    if (n == 0 || n > MAXN || len != 2 * n * KW) {
        return PERF_ERR;
    }
    while ((uint64_t)slots - slots / 8 < n) {
        slots *= 2;
    }
    st.tags = g_tags;
    st.keys = g_keys;
    st.vals = g_vals;
    if (!fmap_init(&m, st, slots, KW, KW, 0)) {
        return PERF_ERR;
    }
    for (i = 0; i < n; i++) {
        if (fmap_put(&m, k + i * KW, k + i * KW) != FMAP_OK) {
            return PERF_ERR;
        }
    }
    for (i = 0; i < n; i++) {
        acc += fmap_get(&m, k + i * KW) != NULL ? 1u : 0u;
    }
    for (i = n; i < n + n / 2; i++) {
        acc += fmap_has(&m, k + i * KW) ? 1000003u : 0u;
    }
    for (i = 0; i < n; i += 2) {
        acc += fmap_del(&m, k + i * KW) ? 7u : 0u;
    }
    for (i = 0; i < n; i++) {
        acc = acc * 31u + (fmap_has(&m, k + i * KW) ? 1u : 0u);
    }
    return acc * 1000003u + fmap_len(&m);
}
'''

