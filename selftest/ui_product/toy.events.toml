# The event catalogue and abstraction key of the toy app (U05; schema ui-events/1, docs/ui-explore.md).
# A real product's catalogue is owner-sealed (P004 8.5); this one is the selftest's fixture.
schema = "ui-events/1"
product = "selftest"
app = "toy"
version = 1

# Every semantic field is in the key; so are the deadline bucket and the enabled env inputs (the two facts).
[key]
fields = ["role", "label", "x", "y", "w", "h", "enabled", "intent", "flags", "style", "importance", "input_policy", "wrap_policy"]
facts = ["deadline", "env-inputs"]
ignore = []

# U1 intent taps (until lvprobe gives the rendered tree, the intent of the one interactive node).
[u1]
events = [
  { id = "tap-press", intent = 1, arg = 0 },
]

# U2 probe taps and U3 complement taps need a tap command, which ui-probe/1 does not have yet.
[u2]
events = []

[u3]
events = []

# U4 code macros through the wedge, by boundary class.
[u4]
events = [
  { id = "code-empty", boundary = "empty", via = "wedge", hex = "" },
  { id = "code-one-digit", boundary = "one-digit", via = "wedge", hex = "37" },
  { id = "code-non-digit", boundary = "non-digit", via = "wedge", hex = "41ff" },
]

# U5 language: the toy has none.
[u5]
events = []

# E1 environment replies: the toy's one env input.
[e1]
events = [
  { id = "env-offline", env = 1, arg = 0, hex = "" },
]

# T1 virtual-time events.
[t1]
events = [
  { id = "fire-due", kind = "fire-due" },
  { id = "before-due", kind = "before-due" },
  { id = "one-frame", kind = "advance", ms = 16 },
  { id = "idle-5min", kind = "advance", ms = 300000 },
]
