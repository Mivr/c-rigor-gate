# The event catalogue of the fixture adapters model_nondet, model_starve and model_tick (fixture.c): the toy's screen,
# but only the press is ever accepted (no wedge, no env input), so only that is declared `accept`.
schema = "ui-events/1"
product = "selftest"
app = "toy-fixture"
version = 1
# The longest virtual wait of one path word (a deadline further away is timer-unreachable).
max_wait_ms = 600000

# Every semantic field is in the key; so are the deadline bucket and the enabled env inputs (the two facts).
[key]
fields = ["role", "label", "x", "y", "w", "h", "enabled", "intent", "flags", "style", "importance", "input_policy", "wrap_policy"]
facts = ["deadline", "env-inputs"]
derived = []
ignore = []

# U1 intent taps (until lvprobe gives the rendered tree, the intent of the one interactive node).
[u1]
events = [
  { id = "tap-press", intent = 1, arg = 0, expect = "accept" },
]

# U2 probe taps and U3 complement taps need a tap command, which ui-probe/1 does not have yet.
[u2]
events = []

[u3]
events = []

# U4: the fixture core refuses every wedge line.
[u4]
events = [
  { id = "code-empty", boundary = "empty", via = "wedge", hex = "", expect = "refuse" },
  { id = "code-one-digit", boundary = "one-digit", via = "wedge", hex = "37", expect = "refuse" },
]

# U5 language: the toy has none.
[u5]
events = []

# E1: the fixture core has no env input.
[e1]
events = []

# T1 virtual-time events.
[t1]
events = [
  { id = "fire-due", kind = "fire-due" },
  { id = "before-due", kind = "before-due" },
  { id = "one-frame", kind = "advance", ms = 16 },
  { id = "idle-5min", kind = "advance", ms = 300000 },
  { id = "until-change", kind = "until-change" },
  { id = "at-10s", kind = "at", offset_ms = 10000 },
]
