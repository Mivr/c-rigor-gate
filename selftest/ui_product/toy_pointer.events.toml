# The event catalogue and abstraction key of the toy app (U05; schema ui-events/1, docs/ui-explore.md), for its
# build with the pointer entry (U05c): toy.events.toml plus `pointer` in `requires`, nothing else.
# A real product's catalogue is owner-sealed (P004 8.5); this one is the selftest's fixture.
schema = "ui-events/1"
product = "selftest"
app = "toy"
version = 1
# The longest virtual wait of one path word (a deadline further away is timer-unreachable), and how often the
# logs (trace, patches) are fetched during a long advance (a whole number of 16 ms frames).
max_wait_ms = 10000
drain_ms = 1024
# U05c: the same catalogue for the toy's build WITH its pointer entry (//selftest/ui_product:probe_pointer): it also
# requires `pointer`, so the explorer refuses the build without the entry (//selftest/ui_product:probe).
requires = ["frame-facts", "ink", "hit-test", "tap", "apply-missed", "crop", "pointer"]

# Every semantic field is in the key; so are the deadline bucket and the enabled env inputs (the two facts).
[key]
fields = ["role", "label", "x", "y", "w", "h", "enabled", "intent", "flags", "style", "importance", "input_policy", "wrap_policy"]
facts = ["deadline", "env-inputs"]
derived = []
ignore = []

# U1 intent taps: the press intent, delivered by the adapter as a tap at the button through the app's own pointer. While
# the notice shows, its transparent clickable scrim takes that tap: `ok apply missed` (the toy's intended F3b canary).
[u1]
events = [
  { id = "tap-press", intent = 1, arg = 0, expect = "accept" },
]

# U2 probe taps (hit query, then a tap through the production pointer path) at the button's centre, aimed at the
# lv_button whose box holds the point; U3 complement
# taps at a point no interactive node covers, which must change nothing (the scrim takes it while the notice shows).
[u2]
events = [
  { id = "probe-press", x = 58, y = 58, target = "lv_button" },
]

[u3]
events = [
  { id = "probe-blank", x = 150, y = 10 },
]

# U4 code macros through the wedge, by boundary class; the toy refuses an empty line in every state.
[u4]
events = [
  { id = "code-empty", boundary = "empty", via = "wedge", hex = "", expect = "refuse" },
  { id = "code-one-digit", boundary = "one-digit", via = "wedge", hex = "37", expect = "accept" },
  { id = "code-non-digit", boundary = "non-digit", via = "wedge", hex = "41ff", expect = "accept" },
]

# U5 language: the toy has none.
[u5]
events = []

# E1 environment replies: the toy's one env input.
[e1]
events = [
  { id = "env-offline", env = 1, arg = 0, hex = "", expect = "accept" },
]

# T1 virtual-time events.
[t1]
events = [
  { id = "fire-due", kind = "fire-due" },
  { id = "before-due", kind = "before-due" },
  { id = "one-frame", kind = "advance", ms = 16 },
  { id = "idle-10s", kind = "advance", ms = 10000 },
  { id = "until-change", kind = "until-change" },
  { id = "at-10s", kind = "at", offset_ms = 10000 },
]
